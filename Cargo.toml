# The first-party kyyn tap: sweep, kb, and the Microsoft Graph family,
# served over the tap harness. This repo is never published to crates.io —
# KBs pin it (repo, rev) in sources.ron and build it on first use.
[package]
name = "kyyn-plugins"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
kyyn-core = "0.1.21"
kyyn-plugin-git = { path = "crates/kyyn-plugin-git" }
kyyn-plugin-graph = { path = "crates/kyyn-plugin-graph" }
kyyn-plugin-kb = { path = "crates/kyyn-plugin-kb" }
kyyn-plugin-pack = { path = "crates/kyyn-plugin-pack" }
kyyn-plugin-salesforce = { path = "crates/kyyn-plugin-salesforce" }
kyyn-plugin-sweep = { path = "crates/kyyn-plugin-sweep" }

[dev-dependencies]
sha2 = "0.10"
wasmparser = "=0.251.0"

[workspace]
resolver = "2"
members = [
    "component-guests/graph-calendar",
    "component-guests/graph-chats",
    "component-guests/graph-mail",
    "component-guests/graph-meetings",
    "component-guests/git-repo",
    "component-guests/kb",
    "component-guests/pack",
    "component-guests/salesforce",
    "component-guests/sharepoint-file",
    "component-guests/sweep",
    "crates/kyyn-plugin-git",
    "crates/kyyn-plugin-bundle",
    "crates/kyyn-plugin-graph",
    "crates/kyyn-plugin-kb",
    "crates/kyyn-plugin-pack",
    "crates/kyyn-plugin-salesforce",
    "crates/kyyn-plugin-sweep",
    "tools/componentize",
]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
