# The first-party Kyyn connector repository: digest-pinned, direction-distinct
# source and sink components plus their repository-level contract gates.
[package]
name = "kyyn-connectors"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dev-dependencies]
ron = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
wasmparser = "=0.251.0"

[workspace]
resolver = "2"
members = [
    "connectors/configurators/microsoft-files",
    "connectors/connections/microsoft",
    "connectors/connections/salesforce",
    "connectors/sinks/file-replace",
    "connectors/sinks/git-ref",
    "connectors/sinks/microsoft-file-replace",
    "connectors/sources/graph-calendar",
    "connectors/sources/graph-chats",
    "connectors/sources/graph-mail",
    "connectors/sources/graph-meetings",
    "connectors/sources/git-repo",
    "connectors/sources/pack",
    "connectors/sources/salesforce",
    "connectors/sources/microsoft-files",
    "connectors/sources/sweep",
    "crates/graph-population-fixture",
    "crates/kyyn-source-bundle",
    "tools/connector-componentize",
]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
