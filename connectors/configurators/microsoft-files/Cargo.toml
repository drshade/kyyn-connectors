[package]
name = "kyyn-configurator-microsoft-files"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wit-bindgen = "=0.58.0"
