[package]
name = "kyyn-component-salesforce"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
kyyn-source-bundle = { path = "../../../crates/kyyn-source-bundle" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "=0.58.0"

[dev-dependencies]
ron = "0.12"
serde = { version = "1", features = ["derive"] }
