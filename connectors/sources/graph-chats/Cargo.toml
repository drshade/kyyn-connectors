[package]
name = "kyyn-component-graph-chats"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
glob = "0.3"
kyyn-source-bundle = { path = "../../../crates/kyyn-source-bundle" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wit-bindgen = "=0.58.0"
